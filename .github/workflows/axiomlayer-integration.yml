name: axiomlayer-github-cli-integration

on:
  pull_request:
  push:
    branches:
      - trunk
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiomlayer-github-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-and-integrity:
    name: contract and all artifact digests
    if: github.repository == 'axiomlayer/github-cli' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'axiomlayer/github-cli' && github.base_ref == 'trunk' && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number) && github.workflow_ref == format('axiomlayer/github-cli/.github/workflows/axiomlayer-integration.yml@refs/pull/{0}/merge', github.event.pull_request.number)) || ((github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/trunk' && github.ref_protected == true && github.workflow_ref == 'axiomlayer/github-cli/.github/workflows/axiomlayer-integration.yml@refs/heads/trunk'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout fork with promoted history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify manifest, source, action pins, and inert publishing
        run: |
          remote_mode=strict-postpublication
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            remote_mode=prepublication
          fi
          python3 integration/axiomlayer/verify.py validate
          python3 integration/axiomlayer/verify.py verify-source
          python3 integration/axiomlayer/verify.py verify-workflows \
            --remote-mode "$remote_mode"
          python3 -m unittest -v integration/axiomlayer/test_verify.py

      - name: Verify every archive and extracted binary digest
        run: |
          python3 integration/axiomlayer/verify.py verify-all-assets \
            --directory "$RUNNER_TEMP/github-cli-assets"

  native-build-test:
    name: ${{ matrix.target }} / ${{ matrix.build_mode }}
    if: github.repository == 'axiomlayer/github-cli' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'axiomlayer/github-cli' && github.base_ref == 'trunk' && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number) && github.workflow_ref == format('axiomlayer/github-cli/.github/workflows/axiomlayer-integration.yml@refs/pull/{0}/merge', github.event.pull_request.number)) || ((github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/trunk' && github.ref_protected == true && github.workflow_ref == 'axiomlayer/github-cli/.github/workflows/axiomlayer-integration.yml@refs/heads/trunk'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-aarch64
            runner: macos-15
            build_mode: nix-native
            nix_system: aarch64-darwin
            python: python3
          - target: darwin-x86_64
            runner: macos-15-intel
            build_mode: nix-native
            nix_system: x86_64-darwin
            python: python3
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            build_mode: nix-native
            nix_system: aarch64-linux
            python: python3
          - target: linux-x86_64
            runner: ubuntu-24.04
            build_mode: nix-native
            nix_system: x86_64-linux
            python: python3
          - target: windows-aarch64
            runner: windows-11-arm
            build_mode: go-native
            nix_system: unsupported
            python: python
          - target: windows-x86_64
            runner: windows-2025
            build_mode: go-native
            nix_system: unsupported
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Checkout fork with promoted history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify and materialize the promoted revision
        shell: bash
        run: |
          ${{ matrix.python }} integration/axiomlayer/verify.py verify-source
          ${{ matrix.python }} integration/axiomlayer/verify.py materialize-source \
            --destination "$RUNNER_TEMP/github-cli-source"

      - name: Prove the credential-sterile Nix boundary
        if: matrix.build_mode == 'nix-native'
        shell: bash
        run: ${{ matrix.python }} integration/axiomlayer/verify.py verify-nix-bootstrap

      - name: Install the exact reviewed Nix runtime
        if: matrix.build_mode == 'nix-native'
        shell: bash
        run: sh integration/axiomlayer/install-nix-ci.sh

      - name: Install source-declared Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: false

      - name: Build and test promoted source in a sterile environment
        shell: bash
        run: |
          bash integration/axiomlayer/run-candidate-ci.sh \
            "${{ matrix.target }}" \
            "${{ matrix.build_mode }}" \
            "${{ matrix.nix_system }}" \
            "$RUNNER_TEMP/github-cli-source"

      - name: Verify and execute the matching published binary
        shell: bash
        run: |
          ${{ matrix.python }} integration/axiomlayer/verify.py verify-asset \
            --target "${{ matrix.target }}" \
            --directory "$RUNNER_TEMP/github-cli-assets" \
            --execute \
            --receipt "$RUNNER_TEMP/${{ matrix.target }}-receipt.json"

  promotion-gate:
    name: promotion gate (build/test only)
    if: always()
    needs:
      - contract-and-integrity
      - native-build-test
    runs-on: ubuntu-24.04
    steps:
      - name: Require every hosted proof
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONTRACT_RESULT: ${{ needs.contract-and-integrity.result }}
          NATIVE_RESULT: ${{ needs.native-build-test.result }}
        run: |
          test "$REPOSITORY" = "axiomlayer/github-cli"
          test "$DEFAULT_BRANCH" = "trunk"
          case "$EVENT_NAME" in
            pull_request)
              test "$HEAD_REPOSITORY" = "axiomlayer/github-cli"
              test "$BASE_REF" = "trunk"
              test "$REF" = "refs/pull/$PR_NUMBER/merge"
              test "$WORKFLOW_REF" = "axiomlayer/github-cli/.github/workflows/axiomlayer-integration.yml@refs/pull/$PR_NUMBER/merge"
              ;;
            push|schedule|workflow_dispatch)
              test "$REF" = "refs/heads/trunk"
              test "$REF_PROTECTED" = "true"
              test "$WORKFLOW_REF" = "axiomlayer/github-cli/.github/workflows/axiomlayer-integration.yml@refs/heads/trunk"
              ;;
            *) exit 1 ;;
          esac
          test "$CONTRACT_RESULT" = success
          test "$NATIVE_RESULT" = success
